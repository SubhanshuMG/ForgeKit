name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/cli/**'
      - 'scripts/generate-coverage-report.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install all workspace dependencies
        run: npm ci --workspaces

      # continue-on-error is deliberate: docs are user-facing and should keep
      # deploying even when the test suite is broken. But jest still writes
      # coverage reports for a FAILING run, so without the guard below this
      # workflow would publish real-looking numbers from a broken build with
      # no signal anywhere. The next step makes that loud.
      - name: Run CLI tests with HTML coverage
        id: cli-tests
        run: |
          npm test --workspace=packages/cli -- \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=html \
            --coverageReporters=json-summary \
            --coverageReporters=json \
            --json --outputFile=coverage/test-results.json
        env:
          CI: true
        continue-on-error: true

      - name: Generate coverage report
        id: cov-report
        run: bash scripts/generate-coverage-report.sh
        continue-on-error: true

      - name: Flag degraded coverage data
        if: steps.cli-tests.outcome == 'failure' || steps.cov-report.outcome == 'failure'
        run: |
          echo "::warning title=Coverage data is degraded::CLI tests or report generation failed. The docs site still deployed, but the coverage numbers on forgekit.build came from a failing run."
          {
            echo "### Docs deployed with degraded coverage data"
            echo ""
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| CLI tests | \`${{ steps.cli-tests.outcome }}\` |"
            echo "| Coverage report | \`${{ steps.cov-report.outcome }}\` |"
            echo ""
            echo "The site deployed anyway, by design, so docs never go stale over an"
            echo "unrelated test failure. But <https://forgekit.build/coverage> now"
            echo "reflects a failing build. Check the **CI** and **Coverage Report**"
            echo "workflows on this commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build VitePress site
        run: npm run build
        working-directory: docs

      - name: Copy coverage HTML into Pages build
        run: |
          mkdir -p docs/.vitepress/dist/coverage-report
          if [ -f "packages/cli/coverage/index.html" ]; then
            cp -r packages/cli/coverage/. docs/.vitepress/dist/coverage-report/
            echo "Coverage HTML copied to /coverage-report/"
          else
            echo "No coverage/index.html found — /coverage-report/ will be empty"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
